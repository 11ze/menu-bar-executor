.settingsbody{min-height:470px;padding:24px 32px;background:var(--subtle)}.settingssection{margin-bottom:24px}.settingssection>h3{margin-bottom:10px}.settingbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 16px}.settingrow{min-height:66px;display:flex;align-items:center;gap:18px;padding:13px 0;border-bottom:1px solid var(--line)}.settingrow:last-child{border:0}.settingrow p{font-size:11px;line-height:1.7;color:var(--muted);margin-top:4px}.switch{width:32px;height:19px;border-radius:20px;padding:2px;border:0;background:var(--blue);min-height:0;flex-shrink:0}.switch:after{content:"";display:block;background:white;border-radius:50%;width:15px;height:15px;margin-left:13px}.switch[aria-checked=true],.switch[aria-checked=true]:hover{background:var(--blue)}.switch[aria-checked=false],.switch[aria-checked=false]:hover{background:var(--muted)}.switch[aria-checked=false]:after{margin-left:0}.historylayout{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:425px}.historylist{border-right:1px solid var(--line);background:var(--material);padding:8px;overflow:auto;max-height:500px}.historyitem{display:block;width:100%;text-align:left;border:0;border-radius:11px;background:transparent;padding:13px 10px;margin-bottom:3px;min-height:78px}.historyitem.active{background:var(--selection)}.historyitem p{font-size:11px;color:var(--muted);margin-top:6px}.historydetail{padding:24px;min-width:0}.historydetail h2{margin-bottom:8px}.metadata{display:flex;gap:14px;font-size:11px;color:var(--muted);margin:16px 0 22px}.output{padding:14px;border:1px solid var(--line);background:var(--subtle);border-radius:6px;min-height:190px;max-height:300px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;line-height:1.9;user-select:text}.detailsection{margin:18px 0}.detailsection .row{margin-bottom:9px}.dialogbackdrop{position:fixed;inset:0;background:#14192338;display:grid;place-items:center;padding:24px;z-index:10}.dialog{width:min(570px,100%);max-height:calc(100vh - 48px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-window);box-shadow:inset 0 1px 0 var(--rim),0 28px 90px #0004}.dialogheader{padding:22px 24px 18px;background:var(--material);border-bottom:1px solid var(--line)}.dialogbody{padding:20px 24px}.field{display:block;margin-bottom:17px}.field>span{display:block;font-weight:500;font-size:12px;margin-bottom:8px}.field input,.field textarea{width:100%}.field textarea{resize:vertical;min-height:96px;line-height:1.8}.field small{display:block;margin-top:7px;font-size:11px;color:var(--muted);line-height:1.7}.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.option{display:flex;align-items:start;gap:9px;margin:16px 0}.option p{margin-top:5px;font-size:11px;line-height:1.7;color:var(--muted)}.option input{margin:1px 0 0}.dialogfoot{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;background:var(--chrome)}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);padding:11px 18px;border:1px solid var(--line);border-radius:8px;background:var(--surface);box-shadow:0 5px 24px #0002;z-index:20;font-size:12px}.reviewfooter{max-width:840px;margin:28px auto 0;border-top:1px solid color-mix(in srgb,var(--text) 12%,transparent);padding-top:16px;color:var(--muted);display:flex;gap:28px;font-size:11px;line-height:1.8}.reviewfooter b{color:var(--text);font-weight:500}
.icon{width:18px;height:18px;display:inline-block;vertical-align:middle;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.palettesearch>.icon{width:22px;height:22px}.brandmark .icon{width:20px;height:20px}.search .icon{width:15px;height:15px}.failure.quiet{color:var(--red)}
.commandswindow{height:min(620px,calc(100dvh - 100px));display:flex;flex-direction:column}.commandswindow>.titlebar,.commandswindow>.toolbar,.commandswindow>.listhead,.commandswindow>.windowfoot{flex-shrink:0}.commandsviewport{flex:1;min-height:0;overflow:auto}.commandswindow>.empty{flex:1;min-height:0}.inlineresult .loading{color:var(--muted);font-size:14px}.inlineresult .failure{font-size:14px}.intro>div:last-child{flex-wrap:wrap;justify-content:flex-end}#autoPreview{font-size:11px;padding:4px 6px;margin-left:4px}@media(max-width:540px){.intro{flex-wrap:wrap}.intro>div:last-child{justify-content:flex-start}}

@media(max-width:760px){.reviewbar{padding:16px;flex-wrap:wrap}.stage{padding:24px 12px}.intro{align-items:start}.intro h1{font-size:21px}.annotation{flex-direction:column;gap:3px}.historylayout{grid-template-columns:240px minmax(0,1fr)}.historydetail{padding:16px}.settingsbody{padding:20px}.reviewfooter{flex-wrap:wrap;gap:12px}.commandrow{padding:12px}.toolbar{padding:12px}.rowactions button{padding:0 8px}.titlebar{padding:0 12px}.palette{margin-top:24px}}@media(max-width:540px){.historylayout{grid-template-columns:1fr}.historylist{max-height:210px;border-right:0;border-bottom:1px solid var(--line)}.fieldgrid{grid-template-columns:1fr;gap:0}.metadata{flex-wrap:wrap}.annotation span:last-child{display:none}.brand .muted{display:none}.palettefoot{gap:8px;flex-wrap:wrap}.settingrow{gap:10px}.settingrow select{max-width:145px}.tabs button{min-width:60px}.commandrow .tag{display:none}}

<body>
<header class="reviewbar"><div class="brand"><span class="brandmark"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 7 5 5-5 5M12 17h7"/></svg></span>MenuBarExecutor <span class="muted" style="font-weight:400">/ 界面设计稿</span></div><nav class="reviewnav" aria-label="设计稿页面"><button data-page="palette" class="active">命令面板</button><button data-page="commands">命令管理</button><button data-page="general">通用设置</button><button data-page="history">执行历史</button></nav><button id="theme" class="quiet" aria-label="切换深浅色">深色预览</button></header>
<main class="stage"><div class="intro"><div><div class="eyebrow" id="eyebrow">01 / COMMAND PALETTE</div><h1 id="heading">找到命令，立即执行。</h1><p id="description">键盘优先，搜索名称、查看状态、直接执行。</p></div><div class="row"><label id="autoPreviewControl" class="muted" style="font-size:11px">自动执行状态 <select id="autoPreview" aria-label="预览自动执行状态"><option value="sample">示例结果</option><option value="loading">执行中</option><option value="failure">失败</option><option value="empty">成功无输出</option></select></label><button id="emptyToggle" class="small quiet">查看空状态</button></div></div><div id="screen"></div><div class="annotation"><span id="annotation"></span><span>交互设计稿 · 示例数据 · 不执行真实命令</span></div><div class="reviewfooter"><span><b>原生与紧凑</b><br>macOS 27 外观方向，系统字体与克制材质。</span><span><b>即时响应</b><br>搜索和键盘选择不加动画。</span><span><b>可复刻</b><br>按原生窗口拆分，可直接对应 SwiftUI 视图。</span></div></main>
<div id="resultPopover" popover="auto" role="region" aria-label="完整执行结果"></div><div id="modal" class="dialogbackdrop hidden"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
const commands=[
 {id:1,name:'查看当前分支',command:'git branch --show-current',group:'开发工具',directory:'~/Projects/menu-bar-executor',auto:true,direct:true,notify:false,result:'main'},
 {id:2,name:'启动 Docker 服务',command:'docker compose up -d',group:'开发工具',directory:'~/Projects/workspace',auto:false,direct:true,notify:true},
 {id:3,name:'清理构建缓存',command:'xcodebuild -project menu-bar-executor.xcodeproj -scheme MenuBarExecutor clean',group:'开发工具',directory:'~/Projects/menu-bar-executor',auto:false,direct:false,notify:true},
 {id:4,name:'部署预发布环境',command:'./deploy.sh staging',group:'部署',directory:'~/Projects/website',auto:false,direct:false,notify:true},
 {id:5,name:'查看服务器磁盘',command:'ssh staging "df -h /"',group:'部署',directory:'',auto:true,direct:false,notify:false,result:'42% 已使用 · 余 58 GB'}
];
const records=[
 {id:1,name:'启动 Docker 服务',command:'docker compose up -d',directory:'~/Projects/workspace',status:'failure',time:'今天 14:32:08',duration:'0.8 秒',code:'1',output:'Cannot connect to the Docker daemon at\nunix:///var/run/docker.sock.\nIs the docker daemon running?'},
 {id:2,name:'清理构建缓存',command:'xcodebuild -project menu-bar-executor.xcodeproj -scheme MenuBarExecutor clean',directory:'~/Projects/menu-bar-executor',status:'success',time:'今天 14:28:41',duration:'3.2 秒',code:'0',output:'Command line invocation:\n    xcodebuild clean\n\n** CLEAN SUCCEEDED **'},
 {id:3,name:'部署预发布环境',command:'./deploy.sh staging',directory:'~/Projects/website',status:'running',time:'今天 14:33:12',duration:'运行中',code:'',output:'连接预发布服务器…\n正在上传构建产物…'},
 {id:4,name:'查看服务器磁盘',command:'ssh staging "df -h /"',directory:'默认目录',status:'success',time:'今天 11:06:23',duration:'1.4 秒',code:'0',output:'Filesystem      Size  Used Avail Use% Mounted on\n/dev/vda1        100G   42G   58G  42% /'}
];
let page='palette',query='',selected=0,empty=false,historyId=1,onlyFailed=false,historyQuery='',editId=null,themeDark=false,autoPreview='sample',autoCheckUpdates=true,toastTimer;
const screen=document.querySelector('#screen');
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=name=>{const paths={terminal:'<path d="m5 7 5 5-5 5M12 17h7"/>',bolt:'<path d="m13 2-8 12h6l-1 8 9-13h-7z"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>'};return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${paths[name]}</svg>`};
const traffic='<div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>';
const filtered=()=>{const groups=[...new Set(commands.map(c=>c.group))];return empty?[]:commands.filter(c=>c.name.toLowerCase().includes(query.toLowerCase())).sort((a,b)=>groups.indexOf(a.group)-groups.indexOf(b.group))};
function notify(message){document.querySelector('#toast').textContent=message;document.querySelector('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.querySelector('#toast').classList.add('hidden'),2600)}
function emptyView(isSearch=false){return `<div class="empty"><div class="symbol">${isSearch?'⌕':'›_'}</div><h2>${isSearch?'没有匹配的命令':'添加你的第一条命令'}</h2><p>${isSearch?'试试其他命令标题。':'给常用的 Shell 命令起个名字，下次直接搜索执行。'}</p><button class="${isSearch?'':'primary'}" data-action="${isSearch?'clear':'add'}">${isSearch?'清空搜索':'添加命令'}</button></div>`}
function autoResult(command){
 if(!command.auto)return null;
 if(autoPreview==='loading')return {state:'loading',text:'执行中…',label:'正在执行',marker:'◌'};
 if(autoPreview==='failure')return {state:'failure',text:'执行失败，退出码 1',label:'执行失败',marker:'×'};
 return {state:'success',text:autoPreview==='empty'||!command.result?'成功，无输出':command.result,label:'执行成功',marker:'●'};

function commandHasOutput(command){return autoPreview==='failure'||(autoPreview==='sample'&&Boolean(command.result));}

document.addEventListener('change',e=>{if(e.target.id==='autoPreview'){autoPreview=e.target.value;render()}if(e.target.id==='onlyFailed'){onlyFailed=e.target.checked;render()}});
document.addEventListener('submit',e=>{if(e.target.id!=='editor')return;e.preventDefault();const f=new FormData(e.target);if(!f.get('name').trim()||!f.get('command').trim()){notify('名称和命令内容不能只包含空白');return}const old=commands.find(c=>c.id===editId);const command={id:editId||Date.now(),name:f.get('name').trim(),command:f.get('command'),group:f.get('group').trim(),directory:f.get('directory').trim(),auto:f.has('auto'),direct:f.has('direct'),notify:f.has('notify')};if(old)commands[commands.indexOf(old)]=command;else{const last=commands.findLastIndex(c=>c.group===command.group);commands.splice(last<0?commands.length:last+1,0,command)}empty=false;closeModal();render();notify('已保存在设计稿内，刷新页面恢复示例数据')});
document.addEventListener('keydown',e=>{if(document.getElementById('resultPopover').matches(':popover-open')){if(e.key==='Escape'){e.preventDefault();closeResult()}return}const modal=document.getElementById('modal');if(!modal.classList.contains('hidden')){if(e.key==='Escape'){e.preventDefault();const cancelDelete=modal.querySelector('[data-action=returnEditor]');if(cancelDelete)cancelDelete.click();else closeModal()}if(e.key==='Tab'){const els=[...modal.querySelectorAll('button,input,textarea,select')].filter(el=>!el.disabled&&el.getClientRects().length);if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus()}}return}if(page!=='palette'||!document.getElementById('paletteSearch'))return;const list=filtered();if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();selected=Math.max(0,Math.min(list.length-1,selected+(e.key==='ArrowDown'?1:-1)));render('paletteSearch');document.querySelector('.paletterow.selected')?.scrollIntoView({block:'nearest'})}if(e.key==='Enter'&&e.target.id==='paletteSearch'&&list[selected]){e.preventDefault();execute(list[selected].id)}if((e.metaKey||e.ctrlKey)&&/^[1-9]$/.test(e.key)){e.preventDefault();const c=list[Number(e.key)-1];if(c)execute(c.id)}if(e.key==='Escape'){e.preventDefault();if(query){query='';render('paletteSearch')}else screen.innerHTML='<div class="empty" style="min-height:400px"><h2>命令面板已关闭</h2><button class="primary" data-page="palette">重新打开面板</button></div>'}if((e.metaKey||e.ctrlKey)&&e.key===','){e.preventDefault();navigate('commands')}});
document.getElementById('emptyToggle').onclick=()=>{empty=!empty;query='';render()};document.getElementById('theme').onclick=()=>{themeDark=!themeDark;document.body.classList.toggle('dark',themeDark);document.getElementById('theme').textContent=themeDark?'浅色预览':'深色预览'};render();
</script>
</body>
</html>
