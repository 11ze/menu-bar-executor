.wb-header{position:sticky;top:0;z-index:12;background:color-mix(in srgb,var(--desktop) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--wb-border)}
.wb-header-inner{min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0}
.wb-brand{display:flex;gap:10px;align-items:center;min-width:0}
.wb-appmark{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--text);color:var(--paper);font:700 17px var(--mono);flex-shrink:0;letter-spacing:-1px}
.wb-brand-text{display:flex;flex-direction:column;min-width:0}
.wb-brand-name{font-weight:600;font-size:13.5px;letter-spacing:-.2px;line-height:1.2}
.wb-brand-sub{font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:1px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.wb-nav{display:flex;gap:2px;padding:3px;border:1px solid var(--wb-border);border-radius:10px;background:var(--wb-surface-2)}
.wb-nav button{border:0;background:transparent;color:var(--muted);padding:6px 12px;font-size:12px;border-radius:7px;display:inline-flex;align-items:center;gap:6px;transition:background-color .14s ease,color .14s ease}
.wb-nav button:hover{color:var(--text);background:color-mix(in srgb,var(--text) 5%,transparent)}
.wb-nav button.active{background:var(--wb-surface);color:var(--text);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.wb-nav-idx{font:11px var(--mono);color:var(--muted);opacity:.7;font-variant-numeric:tabular-nums}
.wb-nav button.active .wb-nav-idx{color:var(--blue);opacity:1}

.wb-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.wb-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;font-size:12px;border-radius:8px;background:var(--wb-surface);border:1px solid var(--wb-border-strong);color:var(--text);transition:background-color .14s ease,border-color .14s ease,color .14s ease}
.wb-btn:hover{background:var(--selection);border-color:color-mix(in srgb,var(--blue) 35%,var(--wb-border));color:var(--blue)}
.wb-btn.wb-btn-quiet{background:transparent;border-color:transparent;color:var(--muted)}
.wb-btn.wb-btn-quiet:hover{background:color-mix(in srgb,var(--text) 6%,transparent);color:var(--text);border-color:transparent}
.wb-btn[aria-pressed="true"]{background:var(--selection);border-color:color-mix(in srgb,var(--blue) 45%,transparent);color:var(--selected-text)}
.wb-dirty-dot{width:6px;height:6px;border-radius:50%;background:var(--blue);display:none}
.wb-btn.is-dirty .wb-dirty-dot{display:inline-block}
.wb-btn.is-dirty{color:var(--text);border-color:var(--wb-border-strong);background:var(--wb-surface)}

.wb-main{padding-top:20px;padding-bottom:44px}

/* 舞台外壳（校准画布 + 顶部控制栏 + 底部情景条） */
.wb-stage-shell{border:1px solid var(--wb-border-strong);border-radius:16px;background:var(--wb-surface);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.wb-stage-bar{min-height:44px;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--wb-surface);border-bottom:1px solid var(--wb-border)}
.wb-stage-meta{display:flex;align-items:center;gap:10px;min-width:0}
.wb-step-pill{font:11.5px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);background:var(--wb-surface-2);border:1px solid var(--wb-border);border-radius:6px;padding:2px 7px}
.wb-screen-name{font-size:13px;font-weight:600;color:var(--text)}
.wb-dim-readout{font:11.5px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);padding-left:10px;border-left:1px solid var(--wb-border)}
.wb-stage-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.wb-seg{display:inline-flex;align-items:center;gap:2px;padding:2px;border-radius:8px;background:var(--wb-surface-2);border:1px solid var(--wb-border)}
.wb-seg button{border:0;background:transparent;color:var(--muted);padding:3px 9px;height:24px;font-size:11.5px;border-radius:6px;font-variant-numeric:tabular-nums;transition:background-color .14s ease,color .14s ease}
.wb-seg button:hover{color:var(--text);background:color-mix(in srgb,var(--text) 5%,transparent)}
.wb-seg button.active{background:var(--wb-surface);color:var(--text);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}

.wb-tool-toggle{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;font-size:11.5px;border-radius:7px;background:var(--wb-surface-2);border:1px solid var(--wb-border);color:var(--muted);transition:background-color .14s ease,color .14s ease,border-color .14s ease}
.wb-tool-toggle:hover{color:var(--text);background:color-mix(in srgb,var(--text) 5%,transparent)}
.wb-tool-toggle[aria-pressed="true"]{background:var(--wb-measure-bg);border-color:color-mix(in srgb,var(--wb-measure) 45%,transparent);color:var(--wb-measure);font-weight:500}

/* 舞台画布 */
.wb-canvas{position:relative;background-color:var(--wb-canvas);background-image:radial-gradient(var(--wb-grid) 1px,transparent 1px);background-size:20px 20px;background-position:10px 10px;overflow-x:auto}
.wb-menubar{height:28px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;background:var(--wb-menubar);backdrop-filter:blur(10px);border-bottom:1px solid var(--wb-border);font-size:11.5px;color:var(--muted);user-select:none}
.wb-menubar-left{display:flex;align-items:center;gap:14px;min-width:0}
.wb-menubar-left strong{color:var(--text);font-weight:600}
.wb-menubar-right{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.wb-menubar-icon{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:5px;border:1px solid transparent;background:transparent;color:var(--text);font:600 11.5px var(--mono)}
.wb-menubar-icon:hover{background:color-mix(in srgb,var(--text) 8%,transparent);color:var(--text)}
.wb-menubar-icon[aria-pressed="true"]{background:var(--selection);color:var(--selected-text);border-color:color-mix(in srgb,var(--blue) 28%,transparent)}
.wb-menubar-shortcut{font:11px var(--mono);color:var(--muted)}

.stage{min-height:560px;display:flex;justify-content:center;align-items:center;padding:34px 28px;position:relative}
.stage.is-palette-stage{min-height:520px;align-items:flex-start;padding-top:30px;padding-bottom:36px}

/* 非侵入式容器宽度/高度模拟（仅在用户选择非默认宽度/矮视口预设时生效） */
.stage[data-preview-width="360"] .window{width:360px!important}
.stage[data-preview-width="360"] .palette-help{gap:4px}
.stage[data-preview-width="360"] .palette-help .wide-only{display:none!important}
.stage[data-preview-width="360"] .palette .windowfoot{gap:6px}
.stage[data-preview-width="800"] .window{width:800px!important}
.stage[data-preview-width="640"] .window{width:640px!important}
.stage[data-preview-width="640"] .history-body{grid-template-columns:220px minmax(0,1fr)}
.stage[data-preview-height="short"] .editor-window .sheet.inline{max-height:430px!important}

/* 红线尺寸标注层（独立覆盖层，pointer-events:none，不改动窗口 DOM） */
.wb-spec-overlay{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.wb-m-box{position:absolute;border:1px dashed var(--wb-measure-line);border-radius:4px}
.wb-m-bar-h{position:absolute;height:1px;background:var(--wb-measure-line)}
.wb-m-bar-h::before,.wb-m-bar-h::after{content:"";position:absolute;top:-3px;width:1px;height:7px;background:var(--wb-measure-line)}
.wb-m-bar-h::before{left:0}.wb-m-bar-h::after{right:0}
.wb-m-bar-v{position:absolute;width:1px;background:var(--wb-measure-line)}
.wb-m-bar-v::before,.wb-m-bar-v::after{content:"";position:absolute;left:-3px;height:1px;width:7px;background:var(--wb-measure-line)}
.wb-m-bar-v::before{top:0}.wb-m-bar-v::after{bottom:0}
.wb-m-pill{position:absolute;font:500 11px/1.2 var(--mono);font-variant-numeric:tabular-nums;color:var(--wb-measure);background:var(--wb-measure-bg);border:1px solid color-mix(in srgb,var(--wb-measure) 38%,transparent);border-radius:5px;padding:2px 6px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* 舞台底部控制条（情景预设 + 快捷体验） */
.wb-stage-tray{padding:10px 16px;background:var(--wb-surface);border-top:1px solid var(--wb-border);display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.wb-tray-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.wb-tray-label{font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap}
.wb-chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:6px;font-size:11.5px;background:var(--wb-surface-2);border:1px solid var(--wb-border);color:var(--text);transition:background-color .14s ease,border-color .14s ease,color .14s ease}
.wb-chip:hover{background:var(--selection);border-color:color-mix(in srgb,var(--blue) 35%,transparent);color:var(--selected-text)}
.wb-chip.active{background:var(--selection);border-color:color-mix(in srgb,var(--blue) 45%,transparent);color:var(--selected-text);font-weight:500}
.wb-chip-try{background:transparent;border-style:dashed;border-color:var(--wb-border-strong);color:var(--muted)}
.wb-chip-try:hover{border-style:solid;background:var(--selection);border-color:color-mix(in srgb,var(--blue) 35%,transparent);color:var(--selected-text)}

/* 规范与验收工作区 */
.wb-deck{margin-top:24px;border:1px solid var(--wb-border-strong);border-radius:16px;background:var(--wb-surface);overflow:hidden}
.wb-deck-head{padding:18px 24px;border-bottom:1px solid var(--wb-border);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.wb-deck-heading{min-width:0}
.wb-deck-kicker{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.wb-deck-title{font-size:19px;font-weight:600;letter-spacing:-.4px;margin-top:4px;line-height:1.3}
.wb-deck-tabs{display:inline-flex;gap:2px;padding:3px;border-radius:9px;background:var(--wb-surface-2);border:1px solid var(--wb-border)}
.wb-deck-tabs button{border:0;background:transparent;color:var(--muted);padding:6px 12px;font-size:12px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;transition:background-color .14s ease,color .14s ease}
.wb-deck-tabs button:hover{color:var(--text);background:color-mix(in srgb,var(--text) 5%,transparent)}
.wb-deck-tabs button.active{background:var(--wb-surface);color:var(--text);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.wb-count-badge{font:11px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);background:color-mix(in srgb,var(--text) 7%,transparent);padding:1px 6px;border-radius:10px}
.wb-deck-tabs button.active .wb-count-badge{background:var(--selection);color:var(--selected-text)}

.wb-deck-body{padding:22px 24px}
.wb-spec-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:start}
.wb-prose{font-size:13px;line-height:1.75;color:var(--muted)}
.wb-section-title{font-size:12px;font-weight:600;color:var(--text);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.wb-shortcuts{margin-top:18px;display:grid;gap:6px}
.wb-shortcut-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 10px;border-radius:8px;background:var(--wb-surface-2);border:1px solid var(--wb-border);font-size:12px}
.wb-shortcut-keys{display:inline-flex;align-items:center;gap:4px;flex-shrink:0}
.wb-shortcut-desc{color:var(--muted);text-align:right}

.wb-spec-card{border:1px solid var(--wb-border);border-radius:12px;background:var(--wb-surface-2);overflow:hidden}
.wb-spec-row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;padding:10px 14px;font-size:12px;align-items:baseline}
.wb-spec-row+.wb-spec-row{border-top:1px solid var(--wb-border)}
.wb-spec-key{color:var(--muted);font-weight:500}
.wb-spec-val{color:var(--text);font-variant-numeric:tabular-nums;line-height:1.55}
.wb-file-pills{display:flex;flex-wrap:wrap;gap:6px}
.wb-file-pill{font:11.5px var(--mono);color:var(--text);background:var(--wb-surface);border:1px solid var(--wb-border);border-radius:5px;padding:2px 7px}
.wb-boundary-note{margin-top:12px;padding:10px 12px;border-radius:9px;background:var(--wb-surface-2);border:1px solid var(--wb-border);font-size:12px;line-height:1.6;color:var(--muted)}
.wb-boundary-note strong{color:var(--text);font-weight:500}

/* 验收清单面板 */
.wb-check-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.wb-check-progress{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.wb-progress-track{width:140px;height:6px;border-radius:4px;background:var(--wb-surface-2);border:1px solid var(--wb-border);overflow:hidden}
.wb-progress-fill{height:100%;background:var(--blue);transition:width .2s ease}
.wb-check-list{display:grid;gap:8px}
.wb-check-item{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:11px 14px;border-radius:10px;border:1px solid var(--wb-border);background:var(--wb-surface-2);transition:border-color .14s ease,background-color .14s ease}
.wb-check-item.is-done{border-color:color-mix(in srgb,var(--green) 35%,var(--wb-border));background:color-mix(in srgb,var(--green) 6%,var(--wb-surface-2))}
.wb-check-label{display:flex;align-items:flex-start;gap:10px;cursor:pointer;flex:1;min-width:0;font-size:12.5px;line-height:1.6;color:var(--text)}
.wb-check-label input{margin-top:3px;flex-shrink:0}
.wb-check-item.is-done .wb-check-text{color:var(--muted);text-decoration:line-through}
.wb-check-trigger{height:24px;padding:0 9px;font-size:11.5px;border-radius:6px;background:var(--wb-surface);border:1px solid var(--wb-border-strong);color:var(--muted);flex-shrink:0}
.wb-check-trigger:hover{background:var(--selection);color:var(--selected-text);border-color:color-mix(in srgb,var(--blue) 35%,transparent)}

/* 设计令牌面板 */
.wb-tokens-layout{display:grid;gap:20px}
.wb-token-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.wb-token-card{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--wb-border);background:var(--wb-surface-2);transition:border-color .14s ease,background-color .14s ease}
.wb-token-card:hover{background:var(--wb-surface);border-color:color-mix(in srgb,var(--blue) 40%,var(--wb-border));color:var(--text)}
.wb-swatch{width:32px;height:32px;border-radius:8px;border:1px solid var(--wb-border-strong);flex-shrink:0}
.wb-token-info{min-width:0;flex:1}
.wb-token-name{font:500 12px var(--mono);color:var(--text);display:flex;align-items:center;justify-content:space-between;gap:6px}
.wb-token-hex{font:11px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.wb-token-role{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.wb-contrast-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.wb-contrast-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 13px;border-radius:10px;border:1px solid var(--wb-border);background:var(--wb-surface-2)}
.wb-contrast-sample{display:inline-flex;align-items:center;justify-content:center;min-width:64px;height:28px;padding:0 8px;border-radius:6px;border:1px solid var(--wb-border);font-size:12px;font-weight:600;flex-shrink:0;white-space:nowrap}
.wb-contrast-meta{flex:1;min-width:0}
.wb-contrast-title{font-size:12px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb-contrast-pair{font:11px var(--mono);color:var(--muted);margin-top:2px;white-space:nowrap}
.wb-contrast-score{font:600 11.5px var(--mono);font-variant-numeric:tabular-nums;padding:2px 7px;border-radius:5px;background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green);flex-shrink:0}

.wb-scale-strip{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wb-scale-box{padding:12px 14px;border-radius:10px;border:1px solid var(--wb-border);background:var(--wb-surface-2);font-size:12px}
.wb-scale-items{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.wb-scale-chip{font:11.5px var(--mono);font-variant-numeric:tabular-nums;padding:3px 8px;border-radius:6px;background:var(--wb-surface);border:1px solid var(--wb-border);color:var(--text)}

/* 页脚 */
.wb-footer{border-top:1px solid var(--wb-border);padding:18px 0 28px;font-size:12px;color:var(--muted)}
.wb-footer-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.wb-footer-left{display:flex;align-items:center;gap:8px}
.wb-footer-right{display:flex;align-items:center;gap:14px}
.wb-footer a{color:var(--muted);border-bottom:1px solid transparent;transition:color .14s ease,border-color .14s ease}
.wb-footer a:hover{color:var(--blue);border-bottom-color:color-mix(in srgb,var(--blue) 45%,transparent)}

@media(min-width:1450px){.stage{min-height:620px}.stage.is-palette-stage{min-height:560px}}
@media(max-width:960px){
  .wb-container{padding:0 20px}
  .wb-header-inner{flex-wrap:wrap;gap:10px;padding:12px 0}
  .wb-nav{order:3;width:100%;justify-content:space-between;overflow-x:auto}
  .wb-nav button{flex:1;justify-content:center}
  .wb-spec-grid{grid-template-columns:1fr;gap:20px}
  .wb-scale-strip{grid-template-columns:1fr}
}
@media(max-width:600px){
  .wb-container{padding:0 12px}
  .wb-nav-idx{display:none}
  .wb-nav button{padding:6px 8px;font-size:11.5px}
  .wb-btn-text-hide{display:none}
  .wb-stage-bar{padding:8px 12px}
  .wb-dim-readout{display:none}
  .wb-menubar-left span{display:none}
  .stage{padding:20px 10px;min-height:460px}
  .stage.is-palette-stage{padding-top:18px;min-height:440px}
  .wb-stage-tray{padding:10px 12px}
  .wb-deck-head{padding:14px 16px}
  .wb-deck-title{font-size:17px}
  .wb-deck-body{padding:16px}
  .wb-spec-row{grid-template-columns:1fr;gap:4px}
}
</style>

<!-- 现有功能来源：Sources/App；视觉来源：InterfaceStyle.swift；此目录为软件界面的设计参照。
设计假设：窗口内部与原生实现严格一致；外部工作台、宽度检验、尺寸标注、验收清单与令牌面板仅用于设计评审与交互体验。全部数据保存在内存，不执行 shell。 -->

<header class="wb-header">
  <div class="wb-container wb-header-inner">
    <a class="wb-brand" href="#palette">
      <span class="wb-appmark" aria-hidden="true">›_</span>

        <span class="wb-brand-name">MenuBarExecutor</span>

      </span>
    </a>

    <nav class="wb-nav" aria-label="设计稿界面">
      <button data-page="palette"><span class="wb-nav-idx">01</span><span>命令面板</span></button>
      <button data-page="commands"><span class="wb-nav-idx">02</span><span>命令管理</span></button>
      <button data-page="editor"><span class="wb-nav-idx">03</span><span>命令编辑</span></button>

        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        <span class="wb-btn-text-hide">重置数据</span>
      </button>
      <button id="theme" class="wb-btn" type="button" aria-label="切换深浅色">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <span>深色</span>

/* ==========================================================================
   3. 工具函数与软件界面渲染逻辑（窗口内部 DOM 与行为保持原样）
   ========================================================================== */
const $=s=>document.querySelector(s);
const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const traffic='<div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>';
const isGroupHidden=g=>(!g||g==='__UNGROUPED__')?hideUngrouped:hiddenGroups.has(g);
const isCommandEffectiveHidden=c=>!!c.hidden||isGroupHidden(c.group||'__UNGROUPED__');
const managedGroups=()=>{const seen=new Set(),ordered=[];for(const g of groupOrder){if(g&&!seen.has(g)){seen.add(g);ordered.push(g)}}for(const c of commands){if(c.group&&!seen.has(c.group)){seen.add(c.group);ordered.push(c.group)}}return ordered};
const pruneHiddenGroups=()=>{const valid=new Set(managedGroups());for(const g of [...hiddenGroups]){if(!valid.has(g))hiddenGroups.delete(g)}};
const groupKeys=()=>{const appeared=[...new Set(commands.map(c=>c.group||''))];if(!groupOrder.length)return appeared;const named=appeared.filter(g=>g!==''),ordered=groupOrder.filter(g=>named.includes(g)),remaining=named.filter(g=>!ordered.includes(g));return appeared.includes('')?[...ordered,...remaining,'']:[...ordered,...remaining]};

function matchNameIndices(text,rawQuery){const trimmed=rawQuery.trim();if(!trimmed)return [];const low=text.toLocaleLowerCase(),qLow=trimmed.toLocaleLowerCase(),idx=low.indexOf(qLow);if(idx>=0)return Array.from({length:trimmed.length},(_,k)=>idx+k);const q=qLow.replace(/\s+/g,'');if(!q)return null;const chars=[...text],tokens=chars.map(ch=>({low:ch.toLocaleLowerCase(),py:PINYIN_MAP[ch]||''}));const memo=new Map();const solve=(i,j,mode)=>{if(j===q.length)return {score:0,ids:[]};if(i===tokens.length)return null;const key=i+','+j+','+mode;if(memo.has(key))return memo.get(key);let best=null;const t=tokens[i],opts=[];if(q[j]===t.low)opts.push([1,true]);if(t.py){let k=0;while(k<t.py.length&&j+k<q.length&&q[j+k]===t.py[k])k++;for(let l=k;l>=1;l--)if(!opts.some(o=>o[0]===l))opts.push([l,false])}for(const[len,lit]of opts){const rest=solve(i+1,j+len,1);if(!rest)continue;const s=rest.score+10+(lit?12:0)+(mode===1?28:0)+(t.py&&len===t.py.length?6:0);const cand={score:s,ids:[i,...rest.ids]};if(!best||cand.score>best.score)best=cand}const skip=solve(i+1,j,mode===0?0:2);if(skip){const cand={score:skip.score-(mode===0?0:4),ids:skip.ids};if(!best||cand.score>best.score)best=cand}memo.set(key,best);return best};const res=solve(0,0,0);return res?res.ids:null}
function matchesName(text,rawQuery){return matchNameIndices(text,rawQuery)!==null}
function highlightName(text,rawQuery){const ids=matchNameIndices(text,rawQuery);if(!ids||!ids.length)return escapeHTML(text);const set=new Set(ids),chars=[...text];let out='',inMark=false;for(let i=0;i<chars.length;i++){const m=set.has(i);if(m&&!inMark){out+='<mark class="hl">';inMark=true}else if(!m&&inMark){out+='</mark>';inMark=false}out+=escapeHTML(chars[i])}return inMark?out+'</mark>':out}
function filtered(){return groupKeys().flatMap(group=>commands.filter(c=>(c.group||'')===group&&matchesName(c.name,query)))}
function visibleFiltered(){return filtered().filter(c=>!isCommandEffectiveHidden(c))}
function toast(message){$('#toast').textContent=message;$('#toast').classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.remove('visible'),2600)}
function markDirty(){isDemoDirty=true;const btn=$('#reset-demo');if(btn)btn.classList.add('is-dirty')}
function searchbox(value,id){return `<div class="searchbox"><span class="search-symbol" aria-hidden="true"></span><input id="${id}" placeholder="搜索命令名称" aria-label="搜索命令名称" value="${escapeHTML(value)}">${value?'<button class="clear" data-action="clearSearch" aria-label="清空搜索">×</button>':''}</div>`}
function windowbar(title,tabs=false){return `<header class="windowbar">${traffic}<span class="windowtitle">${title}</span>${tabs?`<div class="windowtabs" aria-label="设置标签"><button data-page="commands" class="${page==='commands'?'active':''}">命令</button><button data-page="general" class="${page==='general'?'active':''}">通用</button></div>`:''}</header>`}
function empty(title,detail,action,label){return `<div class="empty"><div class="empty-icon" aria-hidden="true">›_</div><strong>${escapeHTML(title)}</strong><p>${escapeHTML(detail)}</p><button data-action="${escapeHTML(action)}">${escapeHTML(label)}</button></div>`}

function palette(){
  if(closed)return `<div class="closed">${empty('命令面板已关闭','正式版本可用全局快捷键再次呼出。','reopen','重新打开面板')}</div>`;
  const visibleAll=commands.filter(c=>!isCommandEffectiveHidden(c));
  const list=visibleFiltered();selected=Math.max(0,Math.min(selected,list.length-1));
  let previousGroup=null;
  const rows=list.map((c,index)=>{const group=c.group||'未分组';let heading=previousGroup!==group?`<div class="group-label">${escapeHTML(group)}</div>`:'';previousGroup=group;
  const output=autoState==='loading'?'正在执行…':autoState==='failed'?'执行失败':autoState==='empty'?'无输出':(c.output||'无输出');
  const canView=c.auto&&autoState!=='loading'&&autoState!=='empty'&&(autoState==='failed'||!!c.output);
  return heading+`<div class="palette-row ${selected===index?'selected':''}" data-index="${index}"><button class="execute" data-execute="${c.id}" title="${escapeHTML(c.name)}">${highlightName(c.name,query)}</button>${c.auto?`<${canView?'button':'div'} class="result" ${canView?`data-result="${c.id}" aria-label="查看${escapeHTML(c.name)}的结果" title="查看结果"`:''}><i class="dot ${autoState==='failed'?'failed':autoState==='loading'?'loading':''}"></i><span>${escapeHTML(output)}</span></${canView?'button':'div'}>`:''}${index<9?`<kbd>⌘${index+1}</kbd>`:''}</div>`}).join('');
  const emptyView=!commands.length?empty('还没有命令','添加一条常用命令，随时呼出执行。','add','添加命令'):(!query&&!visibleAll.length?empty('所有命令均已隐藏','可在设置中重新显示分组或命令，隐藏的自动执行命令不会运行。','openSettings','打开设置'):empty('没有匹配的命令','试试其他名称，或清空搜索。','clearSearch','清空搜索'));
  return `<div class="window palette" data-screen-label="命令面板"><div class="palette-search"><span class="search-symbol" aria-hidden="true"></span><input id="palette-search" aria-label="搜索命令名称" placeholder="搜索命令名称" autocomplete="off" value="${escapeHTML(query)}">${query?'<button class="clear" data-action="clearSearch" aria-label="清空搜索">×</button>':'<kbd>esc</kbd>'}</div><div class="palette-list">${rows||emptyView}</div><footer class="windowfoot"><div class="palette-help"><kbd>↑</kbd><kbd>↓</kbd><span>选择</span><kbd>↵</kbd><span>执行</span>${list.length?'<span class="wide-only" style="display:inline-flex;align-items:center;gap:4px"><kbd>⌘E</kbd><span>编辑</span></span>':''}</div><div class="row"><button data-page="history">执行历史</button><button data-page="commands">设置 <span class="muted">⌘,</span></button></div></footer></div>`;
}

function commandLibrary(){
  const named=managedGroups();
  if(selectedGroup!=='__UNGROUPED__'&&!named.includes(selectedGroup))selectedGroup=named.find(g=>commands.some(c=>c.group===g))||(commands.some(c=>!c.group)?'__UNGROUPED__':(named[0]||'__UNGROUPED__'));
  const q=query.trim().toLocaleLowerCase();
  const ungroupedCount=commands.filter(c=>!c.group).length;
  const visibleCount=commands.filter(c=>!isCommandEffectiveHidden(c)).length;
  const activeAuto=commands.filter(c=>c.auto&&!isCommandEffectiveHidden(c)).length;
  const totalAuto=commands.filter(c=>c.auto).length;
  const groupNavItem=({key,label,count,active,hidden,draggable,muted})=>{
    const a11y=hidden?`${label}，已隐藏，${count} 条命令`:`${label}，${count} 条命令`;
    const attrs=draggable?`draggable="true" data-group="${escapeHTML(key)}"`:`data-drop-group="${escapeHTML(key)}"`;
    const grip=draggable?`<span class="grip" title="拖动调整分组顺序" aria-hidden="true">⋮⋮</span>`:`<span class="grip" aria-hidden="true"></span>`;
    return `<div class="group-nav-item ${active?'active':''} ${hidden?'is-hidden':''}" role="button" tabindex="0" aria-current="${active?'true':'false'}" aria-label="${escapeHTML(a11y)}" ${attrs} data-select-group="${escapeHTML(key)}">${grip}<span class="group-nav-name${muted?' muted':''}" title="${escapeHTML(label)}">${escapeHTML(label)}</span>${hidden?`<span class="nav-hidden-eye" title="${escapeHTML(label)}已隐藏" aria-hidden="true">${EYE_OFF_SVG}</span>`:''}<span class="group-nav-count" aria-hidden="true">${count}</span></div>`;
  };
  const sideGroups=named.map(g=>{
    const active=!q&&selectedGroup===g,cnt=commands.filter(c=>c.group===g).length,hidden=hiddenGroups.has(g);
    if(renamingGroup===g)return `<div class="group-nav-item ${active?'active':''}"><span class="grip">⋮⋮</span><input class="rename-inline" id="group-rename-input" value="${escapeHTML(g)}" data-old="${escapeHTML(g)}" aria-label="重命名分组"></div>`;
    return groupNavItem({key:g,label:g,count:cnt,active,hidden,draggable:true,muted:false});
  }).join('');
  const createInput=creatingGroup?`<div class="group-nav-item"><span class="grip">⋮⋮</span><input class="rename-inline" id="new-group-input" placeholder="输入新分组名称" aria-label="新分组名称"></div>`:'';
  const ungroupedActive=!q&&selectedGroup==='__UNGROUPED__';
  const ungroupedItem=groupNavItem({key:'__UNGROUPED__',label:'未分组',count:ungroupedCount,active:ungroupedActive,hidden:hideUngrouped,draggable:false,muted:true});
  const sidebar=`<aside class="group-sidebar" aria-label="分组列表"><div class="group-sidebar-scroll"><div class="sidebar-section"><span>分组</span><span class="sidebar-hint">拖动排序</span></div>${sideGroups}${createInput}<div class="sidebar-section"><span>默认</span><span class="sidebar-hint">固定末尾</span></div>${ungroupedItem}</div><div class="group-sidebar-foot"><button class="add-group-btn" type="button" data-action="createGroup">＋ 新建分组</button></div></aside>`;
  const cmdRow=(c,allowDrag)=>{
    const grpHidden=isGroupHidden(c.group||'__UNGROUPED__');
    const autoTag=c.auto?(c.hidden?'<span class="tag paused">自动执行 · 已暂停</span>':grpHidden?'<span class="tag paused">自动执行 · 随组暂停</span>':'<span class="tag">自动执行</span>'):'';
    const hiddenTag=c.hidden?'<span class="tag hidden-badge">已隐藏</span>':'';
    const cls=c.hidden?'cmd-hidden':(grpHidden?'inherited-hidden':'');
    const eyeLabel=c.hidden?`恢复显示「${c.name}」`:`在命令面板中隐藏「${c.name}」`;
    return `<div class="command-row ${cls}" draggable="${allowDrag?'true':'false'}" data-cmd-id="${c.id}"><span class="cmd-grip" title="${allowDrag?'拖动排序或拖到左侧分组':''}">${allowDrag?'⋮⋮':''}</span><div class="grow"><h3>${q?highlightName(c.name,query):escapeHTML(c.name)} ${autoTag} ${hiddenTag}</h3><p>${escapeHTML(c.command)}</p></div><div class="row"><button class="row-icon-btn" type="button" data-dryrun="${c.id}" aria-label="试跑「${escapeHTML(c.name)}」" title="试跑此命令（不计入历史）">${PLAY_SVG}</button><button class="row-icon-btn" type="button" data-duplicate="${c.id}" aria-label="复制「${escapeHTML(c.name)}」副本" title="复制命令副本">${COPY_SVG}</button><button class="eye-row-btn ${c.hidden?'is-hidden-state':''}" type="button" data-toggle-cmd="${c.id}" aria-label="${escapeHTML(eyeLabel)}" title="${escapeHTML(eyeLabel)}">${c.hidden?EYE_OFF_SVG:EYE_SVG}</button><button data-edit="${c.id}">编辑</button></div></div>`;
  };
  let subbar='',banner='',body='';
  if(q){
    const list=filtered();
    subbar=`<div class="subbar"><div class="subbar-title">搜索结果 <small>跨全部分组 · ${list.length} 条</small></div><button type="button" data-action="clearSearch">返回当前分组</button></div>`;
    body=list.length?groupKeys().map(group=>{const items=list.filter(c=>(c.group||'')===group);const gHidden=isGroupHidden(group||'__UNGROUPED__');return items.length?`<div class="manage-group">${escapeHTML(group||'未分组')}${gHidden?'<span class="tag hidden-badge">分组已隐藏</span>':''}</div>`+items.map(c=>cmdRow(c,false)).join(''):''}).join(''):empty('没有匹配的命令','试试其他名称，或清空搜索。','clearSearch','清空搜索');
  }else{
    const target=selectedGroup==='__UNGROUPED__'?'':selectedGroup,title=target||'未分组';
    const items=commands.filter(c=>(c.group||'')===target);
    const grpHidden=isGroupHidden(selectedGroup);
    const hiddenInGrp=items.filter(c=>c.hidden).length;
    const subbarActions=`${grpHidden?'':`<button type="button" data-toggle-group="${escapeHTML(selectedGroup)}">隐藏分组</button>`}${target?`<button type="button" data-rename-group="${escapeHTML(target)}">重命名分组</button><button type="button" class="danger" data-dissolve-group="${escapeHTML(target)}">删除分组</button>`:''}`;
    subbar=`<div class="subbar"><div class="subbar-title">${escapeHTML(title)} <small>${items.length} 条${grpHidden?' · 分组已隐藏':(hiddenInGrp?` · ${hiddenInGrp} 条隐藏`:'')}</small></div>${subbarActions?`<div class="row" style="gap:4px">${subbarActions}</div>`:''}</div>`;
    if(grpHidden)banner=`<div class="group-hidden-banner"><div class="banner-left">${EYE_OFF_SVG}<span>此分组已隐藏：组内命令不会在命令面板显示，自动执行已暂停（保留单条显隐设置）。</span></div><button type="button" data-toggle-group="${escapeHTML(selectedGroup)}">恢复显示分组</button></div>`;
    body=items.length?items.map(c=>cmdRow(c,true)).join(''):empty(`「${title}」还没有命令`,'可直接从其他分组拖入命令，或点击右上角添加命令。','add','添加命令');
  }
  return `<section class="window" data-screen-label="命令管理">${windowbar('设置',true)}<div class="commands-workspace">${sidebar}<div class="commands-main"><div class="toolbar"><div class="searchbox"><span class="search-symbol" aria-hidden="true"></span><input id="command-search" placeholder="搜索全部命令名称" aria-label="搜索全部命令名称" value="${escapeHTML(query)}">${query?'<button class="clear" data-action="clearSearch" aria-label="清空搜索">×</button>':''}</div><button class="primary" data-action="add">＋ 添加命令</button></div>${subbar}${banner}<div class="commands-scroll">${body}</div></div></div><footer class="windowfoot"><span>${q?'':'拖动命令可组内排序，拖到左侧分组可跨组移动'}</span><span>共 ${commands.length} 条 · 可见 ${visibleCount} 条 · 自动执行 ${activeAuto}/${totalAuto} 生效</span></footer></section>`;
}

ds.length?'清除筛选':'打开命令面板')}</div>`}<footer class="windowfoot"><span>${list.length} 条记录</span><span>最近 100 条 · 不含自动执行</span></footer></section>`}

/* ==========================================================================
   4. 工作台外壳渲染（菜单栏情境、底部情景条、尺寸标注、规范/验收/令牌面板）
   ========================================================================== */
function isDarkTheme(){return document.documentElement.dataset.theme==='dark'}

function hexToRgb(hex){
  const m=/^#?([0-9a-f]{6})$/i.exec(hex.trim());
  if(!m)return null;
  const n=parseInt(m[1],16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}
function relLuminance([r,g,b]){
  const f=v=>{const c=v/255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4)};
  return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b);
}
function contrastRatio(hex1,hex2){
  const a=hexToRgb(hex1),b=hexToRgb(hex2);
  if(!a||!b)return null;
  const l1=relLuminance(a),l2=relLuminance(b);
  return (Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05);
}
function tokenColorForTheme(cssKey){
  const dark=isDarkTheme();
  const t=DESIGN_TOKENS.find(x=>x.css===cssKey);
  return t?(dark?t.dark:t.light):'#000000';
}

  // 顶部导航高亮
  document.querySelectorAll('.wb-nav button').forEach(b=>{

    b.classList.toggle('active',active);

  $('#wb-width-controls').innerHTML=info.widths.map(w=>`<button type="button" data-wb-width="${w.id}" class="${activeWidth===w.id?'active':''}" aria-pressed="${activeWidth===w.id?'true':'false'}">${escapeHTML(w.label)}</button>`).join('');

/* ==========================================================================
   5. 实时尺寸读数与非侵入式红线标注层
   ========================================================================== */
function updateMeasurements(){
  const win=$('#stage > .window');
  const readout=$('#wb-dim-readout');
  const overlay=$('#wb-spec-overlay');
  const canvas=$('#wb-canvas');
  if(!win){
    if(readout)readout.textContent='面板已关闭';
    if(overlay)overlay.innerHTML='';
    return;
  }
  const wr=win.getBoundingClientRect();
  const w=Math.round(wr.width),h=Math.round(wr.height);
  if(readout)readout.textContent=`${w} × ${h} pt`;
  if(!measureMode||!overlay||!canvas){
    if(overlay)overlay.innerHTML='';
    return;
  }
  const cr=canvas.getBoundingClientRect();
  const rel=r=>({left:r.left-cr.left+canvas.scrollLeft,top:r.top-cr.top+canvas.scrollTop,right:r.right-cr.left+canvas.scrollLeft,bottom:r.bottom-cr.top+canvas.scrollTop,width:r.width,height:r.height});
  const wb=rel(wr);
  let html='';

  // 顶部窗口总宽标尺
  const topY=Math.max(8,wb.top-16);
  html+=`<div class="wb-m-bar-h" style="left:${wb.left}px;top:${topY}px;width:${wb.width}px"></div>`;
  html+=`<div class="wb-m-pill" style="left:${wb.left+wb.width/2}px;top:${topY-10}px;transform:translateX(-50%)">${w} × ${h} pt</div>`;

  // 右侧空间足够时，绘制分区高度/宽度标注
  const rightSpace=cr.width-(wb.right-canvas.scrollLeft);
  if(rightSpace>=84){
    const specsByPage={
      palette:[
        {sel:'.palette-search',label:'搜索区'},
        {sel:'.palette-row',label:'命令行'},
        {sel:'.palette .windowfoot',label:'底栏'}
      ],
      commands:[
        {sel:'.windowbar',label:'标题区'},
        {sel:'.commands-main .toolbar',label:'工具栏'},
        {sel:'.subbar',label:'子栏'},
        {sel:'.command-row',label:'命令行'}
      ],
      editor:[
        {sel:'.sheet-head',label:'页头'},
        {sel:'textarea[name="command"]',label:'命令框'},
        {sel:'.form-foot',label:'底栏'}
      ],
      general:[
        {sel:'.windowbar',label:'标题区'},
        {sel:'.setting',label:'设置行'},
        {sel:'.windowfoot',label:'底栏'}
      ],
      history:[
        {sel:'.windowbar',label:'标题区'},
        {sel:'.toolbar',label:'工具栏'},
        {sel:'.output',label:'输出框'}
      ]
    };
    const items=specsByPage[page]||[];
    const xLine=wb.right+12;
    let lastPillBottom=-999;
    for(const item of items){
      const el=win.querySelector(item.sel);
      if(!el)continue;
      const er=rel(el.getBoundingClientRect());
      if(er.height<8)continue;
      const eh=Math.round(er.height);
      const pillTop=Math.max(lastPillBottom+4,er.top+er.height/2-10);
      lastPillBottom=pillTop+20;
      html+=`<div class="wb-m-box" style="left:${er.left}px;top:${er.top}px;width:${er.width}px;height:${er.height}px"></div>`;
      html+=`<div class="wb-m-bar-v" style="left:${xLine}px;top:${er.top}px;height:${er.height}px"></div>`;
      html+=`<div class="wb-m-pill" style="left:${xLine+8}px;top:${pillTop}px">${item.label} ${eh}</div>`;
    }
  }

  // 底部宽度标尺（双栏侧栏宽）
  const bottomColSel=page==='commands'?'.group-sidebar':page==='history'?'.history-list':null;
  if(bottomColSel){
    const colEl=win.querySelector(bottomColSel);
    if(colEl){
      const col=rel(colEl.getBoundingClientRect());
      if(col.width>40&&col.width<wb.width-40){
        const by=wb.bottom+12;
        html+=`<div class="wb-m-bar-h" style="left:${col.left}px;top:${by}px;width:${col.width}px"></div>`;
        html+=`<div class="wb-m-pill" style="left:${col.left+col.width/2}px;top:${by+6}px;transform:translateX(-50%)">${page==='commands'?'分组栏':'左栏'} ${Math.round(col.width)}</div>`;
      }
    }
  }
  overlay.innerHTML=html;
}

function restoreSeedData(silent=false){
  commands=structuredClone(seedCommands);
  groupOrder=[...seedGroupOrder];
  hiddenGroups=new Set();
  hideUngrouped=false;
  records=structuredClone(seedRecords);
  settings={...seedSettings};
  query='';historyQuery='';selected=0;selectedRecord=101;onlyFailed=false;autoState='success';closed=false;
  selectedGroup='状态速览';renamingGroup=null;creatingGroup=false;pendingDissolveGroup=null;editorId=null;
  Object.keys(wbScenario).forEach(k=>wbScenario[k]='default');
  isDemoDirty=false;
  $('#reset-demo')?.classList.remove('is-dirty');
  if(!silent)toast('已恢复全部示例数据');
}

function applyScenario(key){
  const [scr,mode]=key.split(':');
  wbScenario[scr]=mode;
  closePopover(false);
  $('#modal-layer').innerHTML='';
  editorOrigin=null;

  if(mode==='default'){
    restoreSeedData(true);
    render();
    return;
  }

  // 先基于干净种子构造目标场景，保证结果可预期
  restoreSeedData(true);
  wbScenario[scr]=mode;
  markDirty();

  if(scr==='palette'&&mode==='longtext'){
    commands=[
      {id:1,name:'短标题',command:'curl -s https://api.example.com/status',group:'状态速览',auto:true,direct:true,notify:false,hidden:false,output:'cluster_prod_ap_northeast_1_healthy_v2_8_14_ready_ok'},
      {id:2,name:'检查生产环境多区域 Kubernetes 节点与 Ingress 证书有效期状态',command:'kubectl get nodes && cert-check',group:'状态速览',auto:true,direct:false,notify:false,hidden:false,output:'ap-east-1: 8/8 Ready · TLS 剩余 42 天\nus-west-2: 6/6 Ready · TLS 剩余 19 天'},
      {id:3,name:'查看 Git 分支与未提交改动摘要',command:'git status -sb',group:'状态速览',auto:true,direct:false,notify:false,hidden:false,output:'main [ahead 2] · 3 files modified'},
      ...structuredClone(seedCommands.slice(2))
    ];
  }else if(scr==='palette'&&mode==='allHidden'){
    groupOrder.forEach(g=>hiddenGroups.add(g));
    hideUngrouped=true;
  }else if(scr==='palette'&&mode==='empty'){
    commands=[];
  }else if(scr==='commands'&&mode==='withHidden'){
    hiddenGroups.add('状态速览');
    const c=commands.find(x=>x.id===5);
    if(c)c.hidden=true;
    selectedGroup='状态速览';
  }else if(scr==='commands'&&mode==='emptyGroup'){
    groupOrder=[...seedGroupOrder,'部署与发布'];
    selectedGroup='部署与发布';
  }else if(scr==='editor'&&mode==='newCmd'){
    editorId=-1;
  }else if(scr==='editor'&&mode==='pauseHint'){
    hiddenGroups.add('状态速览');
    editorId=1;
  }else if(scr==='general'&&mode==='noShortcut'){
    settings.shortcut='';
  }else if(scr==='history'&&mode==='failedOnly'){
    onlyFailed=true;
    selectedRecord=102;
  }else if(scr==='history'&&mode==='emptyHistory'){
    records=[];
  }
  render();
}

/* ==========================================================================
   7. 命令管理拖拽、窗口交互与事件绑定（保持原有软件交互）
   ========================================================================== */
function bindCommandLibraryInteractions(){
  if(page!=='commands')return;
  const ri=$('#group-rename-input');
  if(ri){ri.focus();ri.select();const commit=()=>{const next=ri.value.trim(),old=ri.dataset.old;renamingGroup=null;if(next&&next!==old){if(managedGroups().includes(next))toast(`分组「${next}」已存在`);else{groupOrder=managedGroups().map(x=>x===old?next:x);if(hiddenGroups.has(old)){hiddenGroups.delete(old);hiddenGroups.add(next)}commands.forEach(c=>{if(c.group===old)c.group=next});if(selectedGroup===old)selectedGroup=next;markDirty();toast(`已重命名为「${next}」`)}}render()};ri.onkeydown=e=>{if(e.isComposing||e.keyCode===229)return;if(e.key==='Enter')commit();if(e.key==='Escape'){renamingGroup=null;render()}};ri.onblur=commit}
  const ni=$('#new-group-input');
  if(ni){ni.focus();const commitNew=()=>{const name=ni.value.trim();creatingGroup=false;if(name){if(managedGroups().includes(name))toast(`分组「${name}」已存在`);else{groupOrder=[...managedGroups(),name];hiddenGroups.delete(name);selectedGroup=name;markDirty();toast(`已新建分组「${name}」`)}}render()};ni.onkeydown=e=>{if(e.isComposing||e.keyCode===229)return;if(e.key==='Enter')commitNew();if(e.key==='Escape'){creatingGroup=false;render()}};ni.onblur=commitNew}
  const clearHL=()=>document.querySelectorAll('.drag-over,.drag-over-after,.drag-over-reorder,.drag-over-reorder-after,.drag-over-receive').forEach(x=>x.classList.remove('drag-over','drag-over-after','drag-over-reorder','drag-over-reorder-after','drag-over-receive'));
  const clearDrag=()=>{dragType=null;dragPayload=null;document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging'));clearHL()};
  document.querySelectorAll('.group-nav-item[data-group],.group-nav-item[data-drop-group]').forEach(el=>{
    const key=el.dataset.group||'__UNGROUPED__';
    if(el.dataset.group){el.addEventListener('dragstart',e=>{dragType='group';dragPayload=el.dataset.group;el.classList.add('dragging');e.dataTransfer.effectAllowed='move'});el.addEventListener('dragend',clearDrag)}
    el.addEventListener('dragover',e=>{
      if(dragType==='group'&&el.dataset.group&&dragPayload!==el.dataset.group){e.preventDefault();clearHL();const order=managedGroups();el.classList.add(order.indexOf(dragPayload)<order.indexOf(el.dataset.group)?'drag-over-reorder-after':'drag-over-reorder')}
      else if(dragType==='command'){const cmd=commands.find(c=>c.id===dragPayload),tg=key==='__UNGROUPED__'?'':key;if(cmd&&(cmd.group||'')!==tg){e.preventDefault();clearHL();el.classList.add('drag-over-receive')}}
    });
    el.addEventListener('dragleave',()=>el.classList.remove('drag-over-reorder','drag-over-reorder-after','drag-over-receive'));
    el.addEventListener('drop',e=>{
      e.preventDefault();
      if(dragType==='group'&&el.dataset.group&&dragPayload!==el.dataset.group){const order=managedGroups(),from=order.indexOf(dragPayload),to=order.indexOf(el.dataset.group);const[m]=order.splice(from,1);order.splice(to,0,m);groupOrder=order;markDirty();toast(`已调整分组「${m}」顺序`)}
      else if(dragType==='command'){const idx=commands.findIndex(c=>c.id===dragPayload),tg=key==='__UNGROUPED__'?'':key;if(idx>=0&&(commands[idx].group||'')!==tg){const[moved]=commands.splice(idx,1);moved.group=tg;commands.push(moved);pruneHiddenGroups();markDirty();toast(`已将「${moved.name}」移至${tg?`「${tg}」`:'未分组'}`)}}
      clearDrag();render();
    });
  });
  document.querySelectorAll('.command-row[draggable="true"]').forEach(row=>{
    const id=Number(row.dataset.cmdId);
    row.addEventListener('dragstart',e=>{dragType='command';dragPayload=id;row.classList.add('dragging');e.dataTransfer.effectAllowed='move'});
    row.addEventListener('dragend',clearDrag);
    row.addEventListener('dragover',e=>{if(dragType!=='command'||dragPayload===id)return;e.preventDefault();clearHL();const from=commands.findIndex(c=>c.id===dragPayload),to=commands.findIndex(c=>c.id===id);row.classList.add(from<to?'drag-over-after':'drag-over')});
    row.addEventListener('dragleave',()=>row.classList.remove('drag-over','drag-over-after'));
    row.addEventListener('drop',e=>{
      e.preventDefault();if(dragType!=='command'||dragPayload===id)return;
      const from=commands.findIndex(c=>c.id===dragPayload),to=commands.findIndex(c=>c.id===id);
      if(from>=0&&to>=0){const[m]=commands.splice(from,1);commands.splice(to,0,m);markDirty();toast(`已调整「${m.name}」顺序`)}
      clearDrag();render();
    });
  });
}

function render(focusId){

function showDryRun(c,anchor){closePopover();popoverFocus=anchor;const ok=!c.failed,text=c.output||(ok?'（无输出）':'执行失败');$('#popover-layer').innerHTML=`<section class="popover" role="dialog" aria-label="试跑结果"><div class="row spread"><div class="row" style="gap:6px"><i class="dot ${ok?'':'failed'}"></i><h3>${escapeHTML(c.name||'命令试跑')}</h3><span class="${ok?'success':'danger'}" style="font-size:11.5px">${ok?'执行成功':'执行失败'}</span></div><button class="quiet" data-action="closeResult" aria-label="关闭结果">×</button></div><pre style="margin:10px 0;padding:10px;border-radius:7px;background:var(--subtle);border:1px solid var(--line)">${escapeHTML(text)}</pre><div class="row spread"><button data-action="copyResult" ${c.output?'':'disabled'}>复制结果</button><span class="muted" style="font-size:11px">不计入历史</span></div></section>`;const rect=anchor.getBoundingClientRect(),p=$('.popover');p.style.left=Math.max(12,Math.min(rect.left,innerWidth-p.offsetWidth-12))+'px';p.style.top=Math.max(12,Math.min(rect.bottom+8,innerHeight-p.offsetHeight-12))+'px';p.querySelector('button').focus()}
function duplicateCmd(id){const idx=commands.findIndex(c=>c.id===id);if(idx<0)return;const orig=commands[idx],names=new Set(commands.map(c=>c.name));let name=`${orig.name} 副本`,n=2;while(names.has(name))name=`${orig.name} 副本 ${n++}`;commands.splice(idx+1,0,{...orig,id:Date.now(),name});markDirty();toast(`已复制「${name}」`);render()}
function confirmDialog(title,text,action,label){const holder=document.createElement('div');holder.id='confirmation';holder.className='backdrop';holder.style.zIndex=25;holder.innerHTML=`<section class="sheet confirmation" role="dialog" aria-modal="true" aria-label="${title}"><header class="sheet-head"><h2>${title}</h2></header><div class="form-body"><p>${escapeHTML(text)}</p></div><footer class="form-foot"><button data-action="cancelConfirm">取消</button><button class="primary" data-action="${action}">${label}</button></footer></section>`;document.body.append(holder);holder.querySelector('button').focus()}
function closeConfirmation(){pendingDissolveGroup=null;$('#confirmation')?.remove();$('#editor-form [data-action="delete"]')?.focus()}
function execute(id){const c=commands.find(c=>c.id===id);if(!c)return;records.unshift({id:Date.now(),name:c.name,command:c.command,success:!c.failed,time:'今天 '+new Date().toLocaleTimeString('zh-CN',{hour12:false}),output:(c.output||'').slice(0,500)});records=records.slice(0,100);markDirty();toast(`已模拟执行「${c.name}」`)}
function closePopover(restoreFocus=true){if(!$('#popover-layer').firstChild)return;const expanded=$('#editor-form input[name="group"]');if(expanded)expanded.setAttribute('aria-expanded','false');$('#popover-layer').innerHTML='';if(restoreFocus)popoverFocus?.focus();popoverFocus=null}
function positionGroupMenu(anchor){const menu=$('.combo-menu');if(!menu||!anchor)return;const rect=anchor.getBoundingClientRect();const scroller=anchor.closest('.form-body');const clip=scroller?scroller.getBoundingClientRect():{top:0,bottom:innerHeight};if(rect.bottom<=clip.top||rect.top>=clip.bottom||rect.bottom<=0||rect.top>=innerHeight){closePopover(false);return}menu.style.width=rect.width+'px';menu.style.left=Math.max(8,Math.min(rect.left,innerWidth-rect.width-8))+'px';const below=innerHeight-rect.bottom-12,h=menu.offsetHeight;menu.style.top=(h<=below||below>=rect.top-12?rect.bottom+4:Math.max(8,rect.top-h-4))+'px'}
function showGroupMenu(anchor,filterText=''){const input=anchor?.querySelector('input[name="group"]');if(!input)return;const q=filterText.trim().toLocaleLowerCase();const list=managedGroups().filter(g=>!q||g.toLocaleLowerCase().includes(q));if(!list.length){closePopover();return}const current=input.value.trim();$('#popover-layer').innerHTML=`<div class="combo-menu" role="listbox" aria-label="可选分组">${list.map((g,i)=>`<button type="button" class="combo-option ${g===current?'active':''}" role="option" aria-selected="${g===current?'true':'false'}" data-combo-option="${escapeHTML(g)}" data-combo-index="${i}"><span>${escapeHTML(g)}</span>${g===current?'<span class="muted">✓</span>':''}</button>`).join('')}</div>`;input.setAttribute('aria-expanded','true');popoverFocus=input;positionGroupMenu(anchor)}
function showResult(id,anchor){closePopover();const c=commands.find(c=>c.id===id);if(!c)return;popoverFocus=anchor;const result=autoState==='failed'?'执行失败':(c.output||'无输出');$('#popover-layer').innerHTML=`<section class="popover" role="dialog" aria-label="执行结果"><div class="row spread"><h3>${escapeHTML(c.name)}</h3><button class="quiet" data-action="closeResult" aria-label="关闭结果">×</button></div><pre>${escapeHTML(result)}</pre><button data-action="copyResult">复制结果</button></section>`;const rect=anchor.getBoundingClientRect(),p=$('.popover');p.style.left=Math.max(12,Math.min(rect.left,innerWidth-p.offsetWidth-12))+'px';p.style.top=Math.max(12,Math.min(rect.bottom+8,innerHeight-p.offsetHeight-12))+'px';p.querySelector('button').focus()}
async function copy(value,label='已复制'){try{await navigator.clipboard.writeText(value);toast(label)}catch{toast('浏览器未允许复制，请选择文字复制')}}

let composingInput=null;
function updateInput(t){
  if(t.id==='palette-search'||t.id==='command-search'){query=t.value;selected=0;render(t.id)}
  else if(t.id==='history-search'){historyQuery=t.value;render(t.id)}
  else if(t.closest('#editor-form')){validateEditor();updateEditorHint();if(t.name==='group'&&$('.combo-menu'))showGroupMenu(t.closest('.combobox'),t.value)}
}
document.addEventListener('compositionstart',e=>{composingInput=e.target});
document.addEventListener('compositionend',e=>{composingInput=null;updateInput(e.target)});
document.addEventListener('input',e=>{if(!e.isComposing&&e.target!==composingInput)updateInput(e.target)});
document.addEventListener('change',e=>{
  if(e.target.dataset.wbCheck){
    const id=e.target.dataset.wbCheck;
    if(e.target.checked)wbChecked.add(id);else wbChecked.delete(id);
    renderDeck();return;
  }
  if(e.target.id==='only-failed'){onlyFailed=e.target.checked;render()}
  if(e.target.id==='input-source'){settings.input=e.target.value;markDirty()}
  if(e.target.closest('#editor-form'))updateEditorHint();
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='editor-form')return;e.preventDefault();const f=e.target;
  const old=commands.find(c=>c.id===editorId);
  const command={...old,id:(old?old.id:Date.now()),name:f.elements.name.value.trim(),command:f.elements.command.value,group:f.elements.group.value.trim(),directory:f.elements.directory.value,auto:f.elements.auto.checked,direct:f.elements.direct.checked,notify:f.elements.notify.checked,hidden:f.elements.hidden.checked};
  if(!command.name||!command.command.trim())return;
  if(old)commands[commands.indexOf(old)]=command;else commands.push(command);
  if(command.group&&!groupOrder.includes(command.group))groupOrder.push(command.group);
  pruneHiddenGroups();markDirty();
  if(editorOrigin){$('#modal-layer').innerHTML='';editorOrigin=null;render()}else navigate('commands');
  toast('命令已保存到示例数据');
});

document.addEventListener('click',e=>{
  if($('#popover-layer').firstChild&&!e.target.closest('.popover,.combo-menu,.combobox')&&!e.target.closest('[data-result]')&&!e.target.closest('[data-wb-try]'))closePopover(false);
  if(!e.target.closest('input,button'))e.target.closest('.searchbox')?.querySelector('input')?.focus();
  const selectGroup=e.target.closest('[data-select-group]');
  if(selectGroup&&!e.target.closest('button')&&!e.target.closest('input')){selectedGroup=selectGroup.dataset.selectGroup;if(query){query=''}render();return}
  const b=e.target.closest('button');if(!b){if(!e.target.closest('.popover,.combo-menu,.combobox'))closePopover(false);return}

  // 工作台外壳交互（与软件内部交互隔离）
  if(b.dataset.wbWidth){wbPreviewSize[page]=b.dataset.wbWidth;renderWorkbenchChrome();return}
  if(b.dataset.wbAutostate){autoState=b.dataset.wbAutostate;render();return}
  if(b.dataset.wbScenario){applyScenario(b.dataset.wbScenario);return}
  if(b.dataset.wbTry){runQuickTry(b.dataset.wbTry);return}
  if(b.dataset.wbTab){wbTab=b.dataset.wbTab;renderDeck();return}
  if(b.dataset.wbCopy){copy(b.dataset.wbCopy,`已复制 ${b.dataset.wbCopy}`);return}
  if(b.dataset.wbAction==='toggleMeasure'){
    measureMode=!measureMode;
    b.setAttribute('aria-pressed',measureMode?'true':'false');
    updateMeasurements();
    return;
  }
  if(b.dataset.wbAction==='togglePalette'){
    closed=!closed;render();return;
  }
  if(b.dataset.wbAction==='resetDemo'){
    Object.keys(wbPreviewSize).forEach(k=>wbPreviewSize[k]='default');
    restoreSeedData(false);render();return;
  }
  if(b.dataset.wbAction==='clearChecks'){
    wbChecked.clear();renderDeck();toast('已清空验收勾选');return;
  }

  // 主题切换
  if(b.id==='theme'){
    const dark=document.documentElement.dataset.theme!=='dark';
    document.documentElement.dataset.theme=dark?'dark':'light';
    b.innerHTML=(dark?SUN_SVG:MOON_SVG)+`<span>${dark?'浅色':'深色'}</span>`;
    if(wbTab==='tokens')renderDeck();
    return;
  }

  // 软件内部交互（保持原样）
  if(b.dataset.comboOption!==undefined){const input=$('#editor-form input[name="group"]');if(input){input.value=b.dataset.comboOption;updateEditorHint()}closePopover();return}
  if(b.dataset.page){navigate(b.dataset.page);return}
  if(b.dataset.edit){openEditor(Number(b.dataset.edit));return}
  if(b.dataset.dryrun){const c=commands.find(x=>x.id===Number(b.dataset.dryrun));if(c)showDryRun(c,b);return}
  if(b.dataset.duplicate){duplicateCmd(Number(b.dataset.duplicate));return}
  if(b.dataset.execute){execute(Number(b.dataset.execute));return}
  if(b.dataset.result){showResult(Number(b.dataset.result),b);return}
  if(b.dataset.toggleGroup){const g=b.dataset.toggleGroup;if(g==='__UNGROUPED__'){hideUngrouped=!hideUngrouped;toast(hideUngrouped?'已隐藏「未分组」':'已恢复显示「未分组」')}else if(hiddenGroups.has(g)){hiddenGroups.delete(g);toast(`已恢复显示分组「${g}」`)}else{hiddenGroups.add(g);const paused=commands.filter(c=>c.group===g&&c.auto&&!c.hidden).length;toast(paused?`已隐藏「${g}」，${paused} 条自动执行已暂停`:`已隐藏分组「${g}」`)}markDirty();render();return}
  if(b.dataset.toggleCmd){const c=commands.find(x=>x.id===Number(b.dataset.toggleCmd));if(c){c.hidden=!c.hidden;markDirty();toast(c.hidden?(c.auto?`已隐藏「${c.name}」，自动执行已暂停`:`已隐藏「${c.name}」`):`已恢复显示「${c.name}」`);render()}return}
  if(b.dataset.renameGroup){renamingGroup=b.dataset.renameGroup;render();return}
  if(b.dataset.dissolveGroup){const g=b.dataset.dissolveGroup,cnt=commands.filter(c=>c.group===g).length;pendingDissolveGroup=g;confirmDialog('删除分组？',cnt?`将删除分组「${g}」，组内 ${cnt} 条命令会移入「未分组」，不会被删除。`:`将删除空分组「${g}」。`,'confirmDissolveGroup','删除分组');return}
  if(b.dataset.record){selectedRecord=Number(b.dataset.record);render();return}
  if(b.dataset.copyRecord){copy(records.find(r=>r.id===Number(b.dataset.copyRecord)).output);return}
  if(b.dataset.copyCmd){copy(records.find(r=>r.id===Number(b.dataset.copyCmd)).command);return}
  if(b.dataset.rerunRecord){const rec=records.find(r=>r.id===Number(b.dataset.rerunRecord));if(rec){const next={id:Date.now(),name:rec.name,command:rec.command,success:rec.success,time:'今天 '+new Date().toLocaleTimeString('zh-CN',{hour12:false}),output:rec.output};records.unshift(next);records=records.slice(0,100);if(onlyFailed&&next.success)onlyFailed=false;selectedRecord=next.id;markDirty();toast(`已重新模拟执行「${rec.name}」`);render()}return}
  if(b.dataset.toggle){settings[b.dataset.toggle]=!settings[b.dataset.toggle];b.setAttribute('aria-checked',settings[b.dataset.toggle]);markDirty();return}

  const action=b.dataset.action;
  if(action==='createGroup'){creatingGroup=true;render();return}
  if(action==='openSettings'){navigate('commands');return}
  if(action==='add')openEditor();
  if(action==='cancelEditor')closeEditor();
  if(action==='clearSearch'){if(page==='history')historyQuery='';else query='';selected=0;render(page==='palette'?'palette-search':page==='commands'?'command-search':'history-search')}
  if(action==='reopen')navigate('palette');
  if(action==='resetHistory'){historyQuery='';onlyFailed=false;render()}
  if(action==='delete')confirmDialog('删除命令？','将删除此命令。取消后保留编辑草稿。','confirmDelete','删除命令');
  if(action==='confirmDelete'){commands=commands.filter(c=>c.id!==editorId);pruneHiddenGroups();closeConfirmation();markDirty();if(editorOrigin){$('#modal-layer').innerHTML='';editorOrigin=null;render()}else navigate('commands');toast('已删除示例命令')}
  if(action==='confirmDissolveGroup'){const g=pendingDissolveGroup;pendingDissolveGroup=null;closeConfirmation();if(g){groupOrder=managedGroups().filter(x=>x!==g);hiddenGroups.delete(g);commands.forEach(c=>{if(c.group===g)c.group=''});if(selectedGroup===g)selectedGroup=managedGroups().find(x=>commands.some(c=>c.group===x))||'__UNGROUPED__';markDirty();toast(`已删除分组「${g}」，组内命令移入未分组`);render()}}
  if(action==='cancelConfirm'){pendingDissolveGroup=null;closeConfirmation()}
  if(action==='clearHistory')confirmDialog('清空执行历史？','清空示例中的全部执行记录，点击顶部「重置数据」或刷新可恢复。','confirmClear','清空历史');
  if(action==='confirmClear'){records=[];closeConfirmation();markDirty();render()}
  if(action==='closeResult')closePopover();
  if(action==='toggleGroupMenu'){const box=b.closest('.combobox');if($('.combo-menu'))closePopover();else{box?.querySelector('input')?.focus();showGroupMenu(box,'')}return}
  if(action==='copyResult')copy($('.popover pre').textContent);
  if(action==='dryRunDraft'){const f=$('#editor-form');if(f&&f.elements.command.value.trim()){const old=commands.find(c=>c.id===editorId);showDryRun({name:f.elements.name.value.trim()||'命令试跑',command:f.elements.command.value,output:old?.output||'模拟试跑输出（原型不执行真实 shell）',failed:old?.failed},b)}return}
  if(action==='revealConfig')toast('正式版本在 Finder 中定位 ~/.config/menu-bar-executor/settings.json');
  if(action==='directory')toast('目录选择示意：正式版本打开 macOS 目录选择器；原型可直接填写路径');
  if(action==='notification')toast('正式版本打开系统通知设置；原型不读取系统权限');
  if(action==='shortcut')toast('快捷键录制示意：正式版本使用原生录制控件');
  if(action==='clearShortcut'){settings.shortcut='';markDirty();render()}
  if(action==='export')toast('导出示意：正式版本选择位置保存 JSON 配置');
  if(action==='import')confirmDialog('导入配置','正式版本先选择 JSON 文件，再确认替换命令、分组和通用设置。原型不读取或覆盖真实配置。','closeImport','知道了');
  if(action==='closeImport')closeConfirmation();
});

let lastPointer;
document.addEventListener('pointermove',e=>{if(lastPointer?.x===e.clientX&&lastPointer?.y===e.clientY)return;lastPointer={x:e.clientX,y:e.clientY};if(page!=='palette'||$('#modal-layer').firstChild||$('#popover-layer').firstChild)return;const row=e.target.closest('.palette-row');if(!row)return;selected=Number(row.dataset.index);document.querySelectorAll('.palette-row').forEach(r=>r.classList.toggle('selected',Number(r.dataset.index)===selected))});

document.addEventListener('keydown',e=>{
  if(e.isComposing||e.keyCode===229)return;
  if(e.key==='Escape'){e.preventDefault();if($('#confirmation'))closeConfirmation();else if($('#popover-layer').firstChild)closePopover();else if($('#modal-layer').firstChild)closeEditor();else if(page==='palette'){if(query){query='';render('palette-search')}else{closed=true;render()}}else if(page==='editor')closeEditor();return}
  const comboMenu=$('.combo-menu');
  if(comboMenu&&e.key==='Tab'){closePopover(false)}
  else if(comboMenu&&(e.key==='ArrowDown'||e.key==='ArrowUp'||e.key==='Enter')){const opts=[...comboMenu.querySelectorAll('.combo-option')];if(opts.length){const idx=opts.findIndex(o=>o.classList.contains('active'));if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const next=e.key==='ArrowDown'?(idx+1)%opts.length:(idx<=0?opts.length-1:idx-1);opts.forEach((o,i)=>{o.classList.toggle('active',i===next);o.setAttribute('aria-selected',i===next?'true':'false')});opts[next].scrollIntoView({block:'nearest'});return}if(e.key==='Enter'&&idx>=0){e.preventDefault();opts[idx].click();return}}}
  else if(!comboMenu&&document.activeElement?.matches?.('#editor-form input[name="group"]')&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();showGroupMenu(document.activeElement.closest('.combobox'),'');return}
  if($('#editor-form')&&e.metaKey&&e.key==='Enter'){e.preventDefault();const f=$('#editor-form');if(!f.querySelector('[type="submit"]').disabled)f.requestSubmit();return}
  const scope=$('#confirmation')||$('#modal-layer .sheet')||$('.popover');
  if(scope){if(e.key==='Tab'){const focusable=[...scope.querySelectorAll('button:not(:disabled),input,textarea,select')];const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}
  if(page==='commands'&&(e.key==='Enter'||e.key===' ')&&document.activeElement?.matches?.('[data-select-group]')){e.preventDefault();const key=document.activeElement.dataset.selectGroup;selectedGroup=key;if(query)query='';render();document.querySelector(`[data-select-group="${CSS.escape(key)}"]`)?.focus();return}
  if(page!=='palette'||closed)return;
  if(e.metaKey&&e.key===','){e.preventDefault();navigate('commands');return}
  const list=visibleFiltered();if(e.metaKey&&e.key.toLowerCase()==='e'&&list[selected]){e.preventDefault();openEditor(list[selected].id);return}if(e.metaKey&&/^[1-9]$/.test(e.key)){e.preventDefault();if(list[Number(e.key)-1])execute(list[Number(e.key)-1].id);return}
  if(document.activeElement?.tagName==='BUTTON'||document.activeElement?.tagName==='SELECT')return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();selected=Math.max(0,Math.min(list.length-1,selected+(e.key==='ArrowDown'?1:-1)));document.querySelectorAll('.palette-row').forEach(r=>r.classList.toggle('selected',Number(r.dataset.index)===selected));$('.palette-row.selected')?.scrollIntoView({block:'nearest'})}
  if(e.key==='Enter'&&list[selected]){e.preventDefault();execute(list[selected].id)}
});

window.addEventListener('resize',()=>{
  if($('.combo-menu'))positionGroupMenu($('#editor-form .combobox'));
  updateMeasurements();
});
document.addEventListener('scroll',()=>{if($('.combo-menu'))positionGroupMenu($('#editor-form .combobox'))},true);
window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(next!==page)navigate(next)});

navigate(location.hash.slice(1)||'palette');
</script>
